display_information:
  name: RevCrew
  description: AI revenue crew for B2B sales teams
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: RevCrew
    always_online: true
  slash_commands:
    - command: /demo
      url: https://PLACEHOLDER/slack/commands
      description: Run demo commands (new-lead, reply, reset)
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - channels:history

settings:
  event_subscriptions:
    request_url: https://PLACEHOLDER/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://PLACEHOLDER/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false